version: 1.3.16
cache: true
registration:
  socialLogins:
    - openid
modelSpecs:
  prioritize: true
  list:
    - name: elpis-deepseek-flash
      label: Elpis - DeepSeek V4 Flash
      default: true
      preset:
        endpoint: DeepSeek
        model: deepseek-v4-flash
    - name: elpis-gemini-3.5-flash
      label: elpis-gemini-3.5-flash
      default: false
      preset:
        endpoint: google
        model: gemini-3.5-flash
interface:
  customWelcome: Welcome to Elpis
  modelSelect: true
  bookmarks: true
  mcpServers:
    use: true
    create: false
    share: false
    public: false
  parameters: false
  presets: false
  multiConvo: false
  memories: false
  prompts:
    use: false
    create: false
    share: false
    public: false
  agents:
    use: false
    create: false
    share: false
    public: false
  temporaryChat: false
  runCode: false
  webSearch: false
  fileSearch: false
  fileCitations: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  marketplace:
    use: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  skills:
    use: false
    create: false
    share: false
    public: false
  sharedLinks:
    create: false
    share: false
    public: false
  schedules: false
  contextUsage: false
  contextCost: false
  feedback: false
  buildInfo: false
  autoSubmitFromUrl: false
endpoints:
  custom:
    - name: DeepSeek
      apiKey: ${DEEPSEEK_API_KEY}
      baseURL: https://api.deepseek.com
      models:
        default:
          - deepseek-v4-flash
          - deepseek-v4-pro
        fetch: true
      titleConvo: true
      titleModel: deepseek-v4-flash
      modelDisplayLabel: DeepSeek
mcpSettings:
  autoAttachAllServers: false

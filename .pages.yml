settings:
  content:
    merge: true

content:
  - name: elpis-config
    label: Elpis
    type: file
    path: librechat.yaml
    format: yaml
    fields:
      - name: interface
        label: Interface
        type: object
        fields:
          - name: customWelcome
            label: Welcome text
            type: string
      - name: mcpSettings
        label: MCP
        type: object
        fields:
          - name: autoAttachAllServers
            label: Always attach every MCP server
            type: boolean
      - name: modelSpecs
        label: Model specs
        type: object
        fields:
          - name: prioritize
            type: boolean
          - name: list
            label: Specs
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{name} ({index})'
            fields:
              - name: name
                type: string
                required: true
              - name: label
                type: string
              - name: default
                type: boolean
              - name: preset
                label: Preset
                type: object
                fields:
                  - name: endpoint
                    type: select
                    options:
                      values:
                        - DeepSeek
                        - google
                  - name: model
                    type: string

  - name: system-prompt
    label: Master system prompt
    type: file
    path: config/system-prompt.md
    format: code
    options:
      language: markdown

  - name: mcp-servers
    label: MCP servers
    type: file
    path: config/mcp-servers.yml
    format: yaml
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: url
        label: Endpoint URL
        type: string
        required: true
      - name: type
        label: Transport
        type: select
        options:
          values:
            - streamable-http
            - sse
